name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build
        env:
          # Build must not depend on real credentials; pages read env lazily.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  e2e:
    name: E2E (Playwright + local Supabase)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase (applies migrations)
        run: pnpm supabase start

      - name: Write .env.local from local Supabase
        run: |
          eval "$(pnpm --silent supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "PARTICIPANT_TOKEN_SECRET=$(openssl rand -hex 32)"
          } > .env.local

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      - run: pnpm test:e2e
        env:
          E2E_SUPABASE: "1"
          # e2e/webhooks.spec.ts receives webhooks on localhost; never set this in production.
          WEBHOOKS_ALLOW_LOCAL: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - if: always()
        run: pnpm supabase stop
